[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dup"
version = "1.0.0"
description = "Duplicate file finder by content hash (SHA-256)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

[project.scripts]
dup = "dup:main"
